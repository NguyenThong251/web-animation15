<!-- Download pill: fixed at the viewport centre, unfolds horizontally from the middle as the final
     scene progresses and rides up with the footer (core/download.js). The link is always in the tab
     order; focusing it while folded scrolls to the "Tải về" landing where it is open. -->
<div class="download" data-download>
  <div class="download__shift" data-download-shift>
    <div class="download__clip" data-download-clip>
      <div class="download__frame">
        <span class="download__pad" aria-hidden="true"></span>
        <a
          class="download__btn animated-gradient-border group-clip"
          data-download-link
          href="https://fonts.google.com/specimen/EB+Garamond"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="download__btn-inner">
            <span class="download__fill" aria-hidden="true"></span>
            <span class="download__gap" aria-hidden="true"></span>
            <span class="download__label">
              <span class="t-h6 trim trim--h6 download__text"><span class="text-clip"><span data-label="Tải bộ chữ EB Garamond">Tải bộ chữ EB Garamond</span></span></span>
              <svg class="download__icon" viewBox="0 0 12 12" aria-hidden="true" focusable="false">
                <path d="M5 1.5H2.25a.75.75 0 0 0-.75.75v7.5c0 .41.34.75.75.75h7.5c.41 0 .75-.34.75-.75V7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
                <path d="M7.25 1.25h3.5v3.5M10.6 1.4 5.6 6.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <span class="sr-only">(mở trong thẻ mới)</span>
            </span>
            <span class="download__gap" aria-hidden="true"></span>
          </span>
        </a>
        <span class="download__pad" aria-hidden="true"></span>
      </div>
    </div>
  </div>
</div>
