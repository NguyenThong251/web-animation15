<!-- "Cuộn xuống" sticker that trails the cursor from the viewport centre (lg + fine pointer only).
     core/scroll-follower.js moves it and toggles .is-active. -->
<div class="scroll-follower" data-scroll-follower aria-hidden="true">
  <span class="sticker" data-sticker>
    <span class="sticker__surface">
      <span class="sticker__content">
        <span class="t-body t-bold sticker__label">Cuộn<br />xuống</span>
      </span>
    </span>
  </span>
</div>
