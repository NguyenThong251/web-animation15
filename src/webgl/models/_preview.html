<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Xem thử mô hình — Khuê Văn</title>
    <style>
      /* dev-only preview of src/webgl/models: one model, one point light, orbit controls */
      @font-face {
        font-family: "Noto Serif TC Han";
        src: url("/fonts/NotoSerifTC-Han-400.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Noto Serif TC Han";
        src: url("/fonts/NotoSerifTC-Han-700.woff2") format("woff2");
        font-weight: 700;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1c1c1c;
        color: #eee;
        font: 13px/1.4 system-ui, sans-serif;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #ui {
        position: fixed;
        top: 8px;
        left: 8px;
        padding: 6px 9px;
        background: #000a;
        border-radius: 4px;
        white-space: pre;
        pointer-events: none;
      }
      #ui.off {
        display: none;
      }
      #svg {
        position: fixed;
        inset: 0;
        background: #fff;
        display: none;
      }
      #svg svg {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="svg"></div>
    <div id="ui">đang dựng…</div>
    <script type="module" src="./_preview.js"></script>
  </body>
</html>
